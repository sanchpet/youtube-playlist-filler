name: release-please

# release-please maintains the version and CHANGELOG.md from Conventional Commits, and this
# workflow also publishes the image — in a job gated on a release having been cut, rather than in a
# separate workflow reacting to the tag.
#
# That structure is the whole point, not a style choice. A tag pushed by a workflow does NOT start
# another workflow: GitHub deliberately refuses to let `GITHUB_TOKEN` cascade, so a
# "build on tag push" job would simply never fire, and the cluster would go on pinning a commit sha
# while the release chain looked healthy. Building here means the publish happens in the same run
# that created the release, from an event a human caused.
#
# The PAT is what makes the release PR run checks at all: a pull request opened with GITHUB_TOKEN
# does not trigger workflows, so it would sit there with no signal. It is NOT what makes the image
# get published — that is the gated job below, and keeping the publish there is why a revoked or
# expired PAT degrades this to "no checks on the release PR" instead of "releases stop shipping".
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Manifest mode: reads release-please-config.json + .release-please-manifest.json.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The release commit, which is what the tag names. Checking out the branch head instead
          # would publish whatever landed while the release PR sat open — an image whose version
          # number describes a different tree.
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Exactly two tags, both immutable in practice: the version, and the commit it was built
          # from. No `latest` — a moving tag is the thing a digest pin exists to avoid, and having
          # one invites someone to deploy it.
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # What the CronJob must pin, printed where a human can copy it: the tag stays readable and
      # the digest is what actually gets pulled.
      - name: Deployment pin
        run: |
          {
            echo "### Pin this release"
            echo
            echo '```yaml'
            echo "youtube_playlist_filler_version: \"${{ needs.release-please.outputs.version }}\""
            echo "youtube_playlist_filler_digest: \"${{ steps.build.outputs.digest }}\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
