name: ci

# Checks only. The image is built by the release workflow, from a tag — so what runs in the cluster
# is always a released version, and there is no unversioned build lying around in the registry for
# someone to reach for.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise exec -- go build ./...
      - run: mise exec -- go vet ./...
      - run: mise exec -- golangci-lint run ./...
      - run: mise exec -- go test -race ./...

  # The image is only ever built for a release, so a Dockerfile that stopped building would
  # otherwise be discovered at the worst moment — while cutting one. Build it here without pushing.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
